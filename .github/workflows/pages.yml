name: Scan codes and deploy handbook

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    name: Scan gift-code trackers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run scanner
        run: python3 scripts/scan_codes.py
      - name: Commit codes.json if it changed
        run: |
          if git diff --quiet -- site/content/codes.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "kma-code-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add site/content/codes.json
          git commit -m "codes: scheduled scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Someone committing while the scan runs used to make this push fail
          # outright. Rebase onto whatever landed and retry a few times instead.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          echo "could not push the scan after 5 attempts" >&2
          exit 1

  deploy:
    name: Build and deploy
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download game artwork listed in scripts/assets.json
        run: python3 scripts/fetch_assets.py
      - name: Rebuild guides.js from content/
        run: python3 build.py
      - name: Check the data layer
        run: node scripts/test_data.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
